[pytest]
testpaths = tests/unit tests/integration tests/e2e
# Her koşuda test raporları: JUnit XML (CI okur) + tek dosyalık HTML (rapora eklenir).
# E2E testi kalırsa ekran görüntüsü ve trace reports/e2e/ altına kaydedilir.
addopts =
    --junitxml=reports/junit.xml
    --html=reports/test-raporu.html --self-contained-html
    --screenshot=only-on-failure --tracing=retain-on-failure --output=reports/e2e
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
